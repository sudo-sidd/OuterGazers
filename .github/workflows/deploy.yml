name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build with Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_GOOGLE_SCRIPT_URL: ${{ secrets.NEXT_PUBLIC_GOOGLE_SCRIPT_URL || vars.NEXT_PUBLIC_GOOGLE_SCRIPT_URL }}
          NEXT_PUBLIC_UPI_ID: ${{ secrets.NEXT_PUBLIC_UPI_ID || vars.NEXT_PUBLIC_UPI_ID }}
          NEXT_PUBLIC_UPI_PAYEE_NAME: ${{ secrets.NEXT_PUBLIC_UPI_PAYEE_NAME || vars.NEXT_PUBLIC_UPI_PAYEE_NAME }}
          NEXT_PUBLIC_WHATSAPP_GROUP_URL: ${{ secrets.NEXT_PUBLIC_WHATSAPP_GROUP_URL || vars.NEXT_PUBLIC_WHATSAPP_GROUP_URL }}
          NEXT_PUBLIC_CONTACT_EMAIL: ${{ secrets.NEXT_PUBLIC_CONTACT_EMAIL || vars.NEXT_PUBLIC_CONTACT_EMAIL }}
          NEXT_PUBLIC_FORMSUBMIT_URL: ${{ secrets.NEXT_PUBLIC_FORMSUBMIT_URL || vars.NEXT_PUBLIC_FORMSUBMIT_URL }}
          NEXT_PUBLIC_DISCORD_INVITE_URL: ${{ secrets.NEXT_PUBLIC_DISCORD_INVITE_URL || vars.NEXT_PUBLIC_DISCORD_INVITE_URL }}
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID || vars.NEXT_PUBLIC_RAZORPAY_KEY_ID }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
